# Families design/03 section 2 names by prefix ("other grdr-sandbox-*", "grdr-judge-*"). A crate
# listed by name above wins over its family.

[families."grdr-sandbox-*"]
layer = 3

[families."grdr-judge-*"]
layer = 3

# The complete same-layer edge list. Layers 3 and 4 have none: adapters meet only in a program, and
# no program depends on another.

# Every crate of the layer, created now or later, except those listed, may depend on `to`.
[[same_layer_rule]]
layer = 1
to = "grdr-model"
except = ["grdr-fastpath", "grdr-fastpath-ffi"]

[[same_layer_edge]]
from = "grdr-schema"
to = "grdr-proto"

[[same_layer_edge]]
from = "grdr-core"
to = "grdr-fastpath"
scope = "table layout only"

[[same_layer_edge]]
from = "grdr-fastpath-ffi"
to = "grdr-fastpath"
scope = "its only dependency"

[[same_layer_edge]]
from = "grdr-ffi"
to = "grdr-core"

[[same_layer_edge]]
from = "grdr-ffi"
to = "grdr-fastpath"

[[same_layer_edge]]
from = "grdr-wasm"
to = "grdr-core"

[[same_layer_edge]]
from = "grdr-wasm"
to = "grdr-fastpath"

[[same_layer_edge]]
from = "grdr-ports-testkit"
to = "grdr-ports"

[[same_layer_edge]]
from = "grdr-wire"
to = "grdr-crypto"

[[same_layer_edge]]
from = "grdr-messages"
to = "grdr-strings"

# ARCH-002: crates of this layer never depend on each other; they meet only in a program.
[arch002]
layer = 3

# ARCH-004 (ADR-0010): the normal-dependency closure of every `privilege = "privileged"` crate of
# `program_layer` and of the programs named here holds none of `content_parsers`, except the
# decoders below. `grdr-agents` holds the hook dialect translators; `grdr-update` is admitted only
# where its decoder entry says.
[arch004]
program_layer = 4
also_programs = ["grdr-hook"]
content_parsers = ["grdr-core", "grdr-llm-proto", "grdr-mcp-proto", "grdr-agents", "grdr-update", "cedar-policy", "yara-x", "rsigma-*", "serde_json", "regex"]

# A decoder is admitted in the closures `only_in` names, or in every closure ARCH-004 checks when
# it has no `only_in`. `admits` lists the content parsers it may bring with it there; nothing else
# in its own closure is exempt.
[[arch004.decoder]]
crate = "grdr-proto"
decodes = "IPC frames, through the generated protobuf codec"
admits = []

[[arch004.decoder]]
crate = "grdr-update"
decodes = "TUF metadata"
only_in = ["grdr-updater"]
admits = ["serde_json"]

# Crates that appear only under the crates `only_under` names (ARCH-005, ARCH-006). Each workspace
# crate answers for the third-party crates its normal and build edges bring in. `what` names the
# kind of crate in the message.
[[confined]]
rule = "ARCH-005"
what = "a store driver"
crates = ["rusqlite", "libsqlite3-sys"]
only_under = ["grdr-store-local", "grdr-rel-sqlite"]

[[confined]]
rule = "ARCH-005"
what = "a store driver"
crates = ["postgres", "tokio-postgres", "sqlx", "sqlx-*"]
only_under = ["grdr-rel-postgres"]

[[confined]]
rule = "ARCH-005"
what = "a bus driver"
crates = ["async-nats"]
only_under = ["grdr-bus-nats"]

[[confined]]
rule = "ARCH-005"
what = "an object-store driver"
crates = ["object_store"]
only_under = ["grdr-blob", "grdr-lake"]

[[confined]]
rule = "ARCH-006"
what = "a cryptography crate"
crates = [
  "ring", "aws-lc-rs", "aws-lc-sys", "aws-lc-fips-sys", "openssl", "openssl-sys", "boring",
  "boring-sys", "aes", "aes-gcm", "aes-gcm-siv", "chacha20", "chacha20poly1305", "poly1305",
  "sha1", "sha2", "sha3", "blake2", "blake3", "hmac", "hkdf", "pbkdf2", "argon2", "ed25519-dalek",
  "x25519-dalek", "curve25519-dalek", "p256", "p384", "p521", "ecdsa", "rsa",
]
only_under = ["grdr-crypto"]

# The why, fix and escape route of each rule's message (design/03 section 2, "Lint rules"). The
# lint writes the first part, what was found.
[rule.ARCH-001]
why = "a crate depends only on lower layers and the listed same-layer edges, so the core replays on the server and embeds in other products, and no program links a tool crate."
fix = "return what you need written as an `Effect` in `Output`, or add a method to a port in `grdr-ports` and let the layer 4 program pass the adapter in."
escape = "if the layer assignment is wrong: open an RFC (D-61). Do not edit architecture.toml in this change."

[rule.ARCH-002]
why = "adapters meet only in a program, so each can be replaced or left out without touching another."
fix = "move the shared trait or type to layer 2, and join the adapters in the program."
escape = "if the two adapters belong together: open an RFC (D-61). Do not edit architecture.toml in this change."

[rule.ARCH-004]
why = "a parser of untrusted content in a privileged process turns any parser bug into a privileged one (ADR-0010)."
fix = "parse in `grdr-engine` and hand the privileged process a fixed-layout result."
escape = "if a privileged function cannot be met with fixed-layout input: open an RFC (D-61). Do not edit architecture.toml in this change."

[rule.ARCH-005]
why = "store, bus and object-store drivers sit behind the ports, so a profile changes its back end without touching the code that uses it (P6)."
fix = "call the port; add a port method if one is missing."
escape = "if the crate is not a driver of that adapter: change the list in its own issue (D-63). Do not edit architecture.toml in this change."

[rule.ARCH-006]
why = "`grdr-crypto` is the only crate that links cryptography, so every primitive is composed and reviewed in one trust-core crate (D-63)."
fix = "call `grdr-crypto`; a new primitive is a trust-core change there."
escape = "if the crate is not cryptography: change the list in its own issue (D-63). Do not edit architecture.toml in this change."
