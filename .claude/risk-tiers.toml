# Risk-based evaluator selection (ADR-0043). Higher matching tier wins; never lowered.
# Goal: 0 evaluators for green docs/test-only PRs, 1 lean evaluator (eval-review) for normal
# changes, and 2 distinct-model evaluators (eval-review + eval-security) for high/trust-core.

[limits]
max_rounds = 2

[trust_core]
paths_file = "security/trust-core.paths"
distinct_models = 2
evaluators = ["eval-review", "eval-security"]

[high]
paths = [
  "proto/**", "schema/**", "spec/**", "crates/grdr-{proto,schema,model,ports,wire}/**",
  "AGENTS.md", "**/AGENTS.md", "**/REVIEW.md", "CLAUDE.md", "GEMINI.md", "CODEX.md",
  ".agents/**", ".claude/**", "specs/**", "Cargo.lock"
]
triggers = [
  "new_dependency", "major_bump", "public_api_change", "wire_or_pack_format_change",
  "unsafe_added", "fail_mode_change", "security_test_weakened",
  "essentials_or_failsafe_change", "acceptance_changed_after_spec"
]
distinct_models = 2
evaluators = ["eval-review", "eval-security"]

[medium]
paths = ["crates/**", "programs/**", "platform/**", "web/**", "desktop/**", "deploy/**", "lab/**"]
triggers = []
evaluators = ["eval-review"]
model_tier = "standard"

[low]
paths = ["docs/**", "**/*.md"]
triggers = ["tests_only_addition", "additive_behind_flag", "docs_or_config_only"]
evaluators = ["eval-review"]
model_tier = "fast"
# When CI (docs-check, branch-check, security scans, tests) is already green on head and the
# change is purely docs, ADRs, or additive tests, skip spawning LLM evaluators.
skip_evaluators_when_ci_green_and_docs_or_tests_only = true

# Pass these concise one-line checklist reminders inline to eval-review / eval-security instead of
# spawning extra per-kind evaluator or persona-council agents.
[checklist_addons]
ui = "Check keyboard navigation, focus/contrast tokens, and responsive layout via UI specs (no hardcoded colours)."
interface_paths = ["web/**", "site/**", "interface/**", "desktop/**", "programs/grdr/**", "programs/grdr-tray/**", "programs/grdr-approve/**", "platform/*/installer/**"]
api = "Check wire/public Rust API backward compatibility, protobuf data_class annotations, and versioning."
dependency = "Verify new dependencies against supply-chain/licences.toml and Cargo.lock provenance."
installer = "Verify platform signing, uninstall cleanup, and OS path conventions."
content = "Check pack/rule schema validity, false-positive edge cases, and licence allow-list."
adapter = "Verify OS/engine adapter trait compliance and parity across supported platforms."
rfc = "Reviewed by eval-review + eval-security only (no persona council fan-out; max 2 rounds)."
runtime_trust_core = "Confirm reference model, differential tests, and D-62/D-63 boundary checks."
